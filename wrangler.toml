name = "johnyos"
main = "server/worker.js"
compatibility_date = "2024-01-01"

# Both default to false once any config is applied via wrangler, which silently
# turns off the *.workers.dev URL and the version Preview URLs. Declared so a
# `wrangler triggers deploy` cannot disable them again.
workers_dev = true
preview_urls = true

# The production hostname. It was attached in the Cloudflare dashboard only, so
# nothing in the repo recorded it — declared here it survives a worker rebuild.
# Custom domain (not a route): the pattern is the bare hostname, no path.
[[routes]]
pattern = "memo.siwat.me"
custom_domain = true

# Workers Builds ships with no build command configured, so the deploy step used
# to run against a web_dist/ that was never produced. Declaring the build here
# keeps that in the repo instead of in dashboard settings nothing can see.
[build]
command = "npm run build"

# Lives at the repo root, not under server/: Cloudflare Workers Builds only
# looks for the config here. Moving it into server/ broke CI silently for two
# weeks - every push failed in 0s because the config could not be found.
[assets]
directory = "web_dist"
binding = "ASSETS"
# Single-page app: deep links like /tasks must fall through to index.html so
# React Router can handle them.
not_found_handling = "single-page-application"

[vars]
LINE_CHANNEL_ID = "2010502491"
SUPABASE_URL = "https://amcutibopnfasxrfexdi.supabase.co"
