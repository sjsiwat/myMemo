<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memo+ — A private workspace, built for one person.</title>
    <meta
      name="description"
      content="Memo+ is a personal operating system for tasks, notes, expenses, and daily planning — captured instantly through LINE, stored locally first, synced when you want it."
    />

    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Memo+" />

    <!-- Mitr covers Latin and Thai in one family, so there is no separate Thai
         face to host or metric-match. Mitr has no italic, so Newsreader still
         supplies the italic accents. Weights are limited to the four the UI
         actually uses (400/500/600/700). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-grotesk antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
